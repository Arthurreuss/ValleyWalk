name: cacl

grad_balance:
  normalize_components: true        # true: normalise g_new and g_replay individually before combining
                                    # false: combine raw gradients, then normalise the joint
  task_weighted: false               # true: w_replay = t/(t+1), w_new = 1/(t+1)
                                    # false: 50/50

cone:
  alpha_deg: 45.0                    # cone half-angle in degrees

lanczos:
  k: 20                              # Lanczos iterations
  d: 10                               # top-d dangerous eigenvectors retained
  amortize_K: 5                   # recompute every K steps (higher for large models)

trust_region:
  enabled: false
  initial_radius: 0.1
  expand_threshold: 0.9              # rho > this → double radius
  contract_threshold: 0.25           # rho < this → halve radius
  min_radius: 1.0e-4
  max_radius: 1.0
  loss_target: joint                 # joint | replay — which loss the trust ratio evaluates

hessian:
  target: replay                     # replay | joint — which Hessian to Lanczos-decompose

# λ-curriculum (homotopy on the new-task loss weight).
# Effective loss minimised this step:  L_λ = L_replay + λ · L_current
# At λ=0 the optimiser only sees L_replay, where ∇L_replay ≠ 0 even at θ_0*
# (unlike ∇L_0_full ≈ 0).  Ramping λ from 0 → 1 over the first ramp_steps
# of each new task pre-tensions the L_replay restoring force, removing
# the unopposed first task-1 step that drives the trajectory bend.
# Targets the trajectory component of the stability gap.
lambda_curriculum:
  enabled: false                     # off by default — preserves existing behaviour
  ramp_steps: 0                      # number of steps to ramp 0 → 1 (0 = disabled)
  schedule: linear                   # linear | cosine
