defaults:
  - method: ncl
  - dataset: rot_mnist
  - model: mlp
  - _self_

seed: 22

# Device: "auto" resolves to mps > cuda > cpu at runtime.
# Override with device=cpu, device=cuda, or device=mps.
device: auto

training:
  epochs_per_task: 1                 # online: 1 epoch per task
  batch_size: 256
  optimizer: sgd                     # base optimizer (only for methods that use it)
  lr: 0.1                            # base learning rate (overridden by trust region for CACL)
  momentum: 0.0                      # SGD momentum (0.0 = plain SGD)
  weight_decay: 0.0

memory:
  total_budget: 1000                # total samples across all replay buffers
  sampling: reservoir                # reservoir | ring

eval:
  eval_every_n_steps: 10              # general periodic eval → logged to W&B live
  stability_gap:
    enabled: true
    eval_freq_steps: 1              # fine-grained eval cadence at task start/end
    window_steps: 250               # steps into a new task to keep fine-grained cadence
    pre_switch_steps: 10           # steps before a task ends to activate fine-grained cadence
    # ── g_true diagnostics (Chapter 3.2.1 / 3.2.2) ─────────────────────
    # When enabled, at each step of every task with task_id > 0 the method
    # computes ``g_true`` ≔ ∇_θ L_past(θ) on the FULL past-task training
    # set (zero sampling noise — the deterministic empirical past-task
    # gradient at the current parameters) and logs:
    #   - true_grad_cosine     — cos(g_replay, g_true), directional bias
    #   - true_grad_mag_ratio  — ‖g_replay‖ / ‖g_true‖,   magnitude bias
    # Cost: one extra forward+backward over every past-task sample per
    # step.  For rot-MNIST + MLP (≤ 60 000 past samples, 478 k params)
    # this fits comfortably on commodity hardware; for larger backbones
    # the toggle should stay off (it is already off for the D-series).
    grad_diagnostics:
      enabled: false

# ──────────────────────────────────────────────
# Checkpointing & local artifact storage
# ──────────────────────────────────────────────
checkpointing:
  save_every_n_tasks: 1              # save model state_dict after every task
  save_final: true                   # always save model after last task
  save_buffer: true                  # save replay buffer state for reproducibility
  dir: checkpoints/                  # relative to Hydra job dir

outputs:
  dir: results/                      # relative to Hydra job dir
  save_accuracy_matrix: true         # R[i,j] as .npy
  save_task_curves: true             # per-step loss/acc CSVs per task
  save_diagnostics: true             # eigenvalues, trust radius, fallback per step

# ──────────────────────────────────────────────
# Tracking: W&B (live monitoring + artifacts)
# ──────────────────────────────────────────────
tracking:
  backend: wandb                     # wandb | csv_only (for debugging without W&B)
  wandb:
    project: Gap Anatomy
    entity: arthurreuss-bachelor-thesis                     
    tags: []                         # auto-populated at runtime: [method, dataset, ablation]
    # W&B Artifacts — versioned model + results linked to each run
    artifacts:
      log_checkpoints: true          # upload model checkpoints as W&B Artifacts
      log_results: true              # upload results/ dir as W&B Artifact at run end
      checkpoint_type: model         # W&B Artifact type for checkpoints
      results_type: results          # W&B Artifact type for results bundle
  # Local diagnostics (always written regardless of backend)
  local:
    log_eigenvalues: false           # per-step eigenvalue spectrum CSV (expensive I/O)
    log_cone_fallback: true          # per-step cone fallback CSV
    log_trust_radius: true           # per-step trust radius + rho CSV
    log_wall_clock: true             # per-task wall clock timing

hydra:
  run:
    dir: outputs/${method.name}/${dataset.name}/${now:%Y-%m-%d_%H-%M-%S_%f}
  sweep:
    dir: outputs/${method.name}/${dataset.name}/${now:%Y-%m-%d_%H-%M}
  job:
    chdir: true
