[project]
name = "valleywalk"
version = "0.1.0"
description = "CACL continual learning experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "wandb>=0.16.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "imagecorruptions>=1.1.2",
    "quadprog>=0.1.13",
    "hydra-joblib-launcher>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
